<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none">
  <!-- RAD -->
  <text x="20" y="190"
    font-family="'Cormorant Garamond','Didot','Garamond',Georgia,serif"
    font-size="88" font-weight="300" fill="#111"
    letter-spacing="14">RAD</text>

  <!-- ANT -->
  <text x="278" y="190"
    font-family="'Cormorant Garamond','Didot','Garamond',Georgia,serif"
    font-size="88" font-weight="300" fill="#111"
    letter-spacing="14">ANT</text>

  <!-- Steam curve — replaces the I, flows down into the cup -->
  <path d="M 255,18 C 268,55 238,95 248,135 C 256,165 260,195 256,222 C 253,242 248,260 248,278"
        stroke="#111" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sparkle ✦ -->
  <g transform="translate(248,285)">
    <line x1="0" y1="-7" x2="0"  y2="7"  stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-7" y1="0" x2="7"  y2="0"  stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4"  stroke="#111" stroke-width="1"   stroke-linecap="round"/>
    <line x1="4"  y1="-4" x2="-4" y2="4" stroke="#111" stroke-width="1"   stroke-linecap="round"/>
  </g>

  <!-- Cup top ellipse -->
  <ellipse cx="248" cy="312" rx="42" ry="11"
    stroke="#111" stroke-width="1.8"/>

  <!-- Cup body -->
  <path d="M 206,312 L 209,352 Q 248,366 287,352 L 290,312"
    stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cup handle -->
  <path d="M 287,322 Q 306,322 306,337 Q 306,352 287,352"
    stroke="#111" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- COFFEE & BAKERY -->
  <text x="260" y="400"
    font-family="'Cormorant Garamond','Didot','Garamond',Georgia,serif"
    font-size="22" font-weight="300" fill="#111"
    letter-spacing="8" text-anchor="middle">COFFEE &amp; BAKERY</text>
</svg>
